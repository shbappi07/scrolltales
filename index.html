/* ===== নতুন গল্প এখানে লিখো =====
   scene = কোন ব্যাকগ্রাউন্ড ছবি (scene1.webp ... sceneN.webp)
   SCENE_COUNT আর ছবির সংখ্যা মিলিয়ে দিলেই নতুন গল্প চলবে। */
const SCENE_COUNT = 12;
const STORY = {
  title: "\u09a8\u09a6\u09c0 \u09a5\u09c7\u09ae\u09c7 \u09a5\u09be\u0995\u09c7 \u09a8\u09be",
  subtitle: "\u098f\u0995\u099f\u09be \u09ad\u09be\u0999\u09cd\u0997\u09be \u09b9\u09c3\u09a6\u09af\u09bc\u09c7\u09b0 \u0997\u09b2\u09cd\u09aa \u0964 \u09a7\u09c0\u09b0\u09c7 \u09b8\u09cd\u0995\u09cd\u09b0\u09b2 \u0995\u09b0\u09cb \u2014 \u09a8\u09a6\u09c0 \u09a4\u09cb\u09ae\u09be\u09b0 \u09b8\u0999\u09cd\u0997\u09c7 \u099a\u09b2\u09ac\u09c7 \u0964",
  endTitle: "\u09b8\u09ae\u09be\u09aa\u09cd\u09a4",
  endNote: "\u0989\u09aa\u09b0\u09c7 \u0989\u09a0\u09c7 \u0986\u09ac\u09be\u09b0 \u09aa\u09a1\u09bc\u09cb",
  sections: [
    {scene:1, text:"\u09ae\u09cb\u09b9\u09a8\u09be \u0998\u09be\u099f\u09c7\u09b0 \u09aa\u09c1\u09b0\u09cb\u09a8\u09cb \u09b8\u09bf\u0981\u09a1\u09bc\u09bf\u09a4\u09c7 \u09aa\u09cd\u09b0\u09a4\u09bf\u09a6\u09bf\u09a8 \u09b8\u09a8\u09cd\u09a7\u09cd\u09af\u09be\u09af\u09bc \u09ac\u09b8\u09a4 \u09b0\u09be\u09ab\u09bf\u0964 \u09a8\u09a6\u09c0\u09b0 \u0993\u09aa\u09be\u09b0\u09c7 \u09b8\u09c2\u09b0\u09cd\u09af \u09a1\u09c1\u09ac\u09b2\u09c7 \u09b8\u09c7 \u0997\u09c1\u09a8\u09a4 \u2014 \u09b2\u099e\u09cd\u099a\u0997\u09c1\u09b2\u09cb \u0995\u09a4\u099f\u09be \u0986\u09b2\u09cb \u09ac\u09b9\u09a8 \u0995\u09b0\u09c7 \u0998\u09b0\u09c7 \u09ab\u09c7\u09b0\u09c7\u0964 \u09ac\u09be\u09ac\u09be\u09b0 \u09ae\u09c3\u09a4\u09cd\u09af\u09c1\u09b0 \u09aa\u09b0 \u099c\u09c7\u09b2\u09c7\u09aa\u09be\u09dc\u09bc\u09be\u09b0 \u098f\u0987 \u0998\u09be\u099f\u0987 \u09a4\u09be\u09b0 \u098f\u0995\u09ae\u09be\u09a4\u09cd\u09b0 \u09ad\u09b0\u09b8\u09be, \u0986\u09b0 \u09b8\u09cd\u09ac\u09aa\u09cd\u09a8\u099f\u09be \u099b\u09bf\u09b2 \u099b\u09cb\u099f: \u09a8\u09a6\u09c0\u09b0 \u0993\u09aa\u09be\u09b0\u09c7\u09b0 \u09b8\u09cd\u0995\u09c1\u09b2\u09c7 \u09b6\u09bf\u0995\u09cd\u09b7\u0995 \u09b9\u0993\u09af\u09bc\u09be\u0964"},
    {scene:2, text:"\u09a4\u09be\u09b0\u09aa\u09b0 \u098f\u0995 \u09ad\u09cb\u09b0\u09c7 \u0995\u09c1\u09af\u09bc\u09be\u09b6\u09be \u09ad\u09c7\u09a6 \u0995\u09b0\u09c7 \u09b2\u099e\u09cd\u099a \u09a5\u09c7\u0995\u09c7 \u09a8\u09be\u09ae\u09b2 \u09a4\u09be\u09b0\u09be \u2014 \u09a8\u09a6\u09c0\u09b0 \u0993\u09aa\u09be\u09b0\u09c7\u09b0 \u09b8\u09cd\u0995\u09c1\u09b2\u09ae\u09bf\u09b8\u09cd\u09a4\u09cd\u09b0\u09c0\u09b0 \u09ae\u09c7\u09af\u09bc\u09c7, \u09b9\u09be\u09a4\u09c7 \u09ac\u0987\u09af\u09bc\u09c7\u09b0 \u09ac\u09cd\u09af\u09be\u0997, \u099a\u09cb\u0996\u09c7 \u0985\u09a6\u09cd\u09ad\u09c1\u09a4 \u098f\u0995 \u09a6\u09c1\u09b8\u09be\u09b9\u09b8\u0964 \u0998\u09be\u099f\u09c7\u09b0 \u09b8\u09bf\u0981\u09a1\u09bc\u09bf \u09ad\u09bf\u099c\u09c7 \u099b\u09bf\u09b2; \u09b0\u09be\u09ab\u09bf \u098f\u0997\u09bf\u09af\u09bc\u09c7 \u0997\u09bf\u09af\u09bc\u09c7 \u09b9\u09be\u09a4 \u09a7\u09b0\u09c7 \u09a4\u09c1\u09b2\u09b2\u0964 \u2018\u09a7\u09a8\u09cd\u09af\u09ac\u09be\u09a6,\u2019 \u09b8\u09c7 \u09ac\u09b2\u09b2, \u2018\u09a4\u09cb\u09ae\u09be\u09b0 \u09a8\u09a6\u09c0\u099f\u09be \u0995\u09bf \u09b8\u09ac\u09b8\u09ae\u09af\u09bc \u098f\u09ae\u09a8 \u09b6\u09be\u09a8\u09cd\u09a4 \u09a5\u09be\u0995\u09c7?\u2019"},
    {scene:3, text:"\u099a\u09be \u09a6\u09cb\u0995\u09be\u09a8\u09c7\u09b0 \u09aa\u09c1\u09b0\u09cb\u09a8\u09cb \u09ac\u09c7\u099e\u09cd\u099a\u09c7 \u09a4\u09be\u09b0\u09aa\u09b0 \u09ac\u09b8\u09a4 \u09a4\u09be\u09a6\u09c7\u09b0 \u09b8\u09a8\u09cd\u09a7\u09cd\u09af\u09be\u0964 \u0995\u09c7\u09a4\u09b2\u09bf\u09b0 \u09a7\u09cb\u09af\u09bc\u09be, \u0997\u09b2\u09cd\u09aa, \u0986\u09b0 \u09b9\u09be\u09b8\u09bf \u2014 \u098f\u09a4 \u09b8\u09b9\u099c\u09c7 \u09ad\u09b0\u09b8\u09be \u09b9\u09af\u09bc\u09c7 \u0993\u09a0\u09c7 \u09ae\u09be\u09a8\u09c1\u09b7, \u09b0\u09be\u09ab\u09bf \u09a4\u0996\u09a8 \u099c\u09be\u09a8\u09a4 \u09a8\u09be\u0964 \u09a4\u09be\u09b0\u09be \u09ac\u09b2\u09a4, \u2018\u09b6\u09bf\u0995\u09cd\u09b7\u0995 \u09b9\u09ac\u09c7 \u09b6\u09c1\u09a8\u09c7\u099b\u09bf? \u0986\u09ae\u09be\u09b0\u0993 \u09a4\u09cb \u0993\u09aa\u09be\u09b0\u09c7 \u09b8\u09cd\u0995\u09c1\u09b2 \u0996\u09c1\u09b2\u09a4\u09c7 \u0987\u099a\u09cd\u099b\u09c7 \u0995\u09b0\u09c7\u0964\u2019 \u09a6\u09c1\u099f\u09cb \u09b8\u09cd\u09ac\u09aa\u09cd\u09a8 \u098f\u0995 \u09a8\u09a6\u09c0\u09b0 \u09a6\u09c1\u0987 \u09aa\u09be\u09a1\u09bc\u09c7 \u0997\u09a1\u09bc\u09c7 \u0989\u09a0\u099b\u09bf\u09b2\u0964"},
    {scene:4, text:"\u09b6\u09cd\u09b0\u09be\u09ac\u09a3\u09c7\u09b0 \u098f\u0995 \u09b8\u09a8\u09cd\u09a7\u09cd\u09af\u09be\u09af\u09bc \u09ac\u09c3\u09b7\u09cd\u099f\u09bf \u098f\u09b2 \u09b9\u09a0\u09ce\u09a4\u0964 \u098f\u0995\u099f\u09be\u0987 \u099b\u09be\u09a4\u09be, \u09a6\u09c1\u099c\u09a8 \u09ae\u09be\u09a8\u09c1\u09b7, \u0986\u09b0 \u09b8\u09cd\u09b2\u09c7\u09b7\u09c7 \u09ad\u09c7\u099c\u09be \u09b0\u09be\u09b8\u09cd\u09a4\u09be\u0964 \u2018\u09ad\u09af\u09bc \u09a8\u09c7\u0987,\u2019 \u09a4\u09be\u09b0\u09be \u09ac\u09b2\u09b2, \u2018\u09ac\u09c3\u09b7\u09cd\u099f\u09bf \u09a4\u09cb \u09a5\u09be\u09ae\u09ac\u09c7\u0987\u0964\u2019 \u09b0\u09be\u09ab\u09bf \u09b8\u09c7\u09a6\u09bf\u09a8 \u09ac\u09c1\u099d\u09b2, \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be \u09ae\u09be\u09a8\u09c7 \u099d\u09a1\u09bc\u09c7\u09b0 \u09ae\u09a7\u09cd\u09af\u09c7 \u099b\u09be\u09a4\u09be \u09ad\u09be\u0997 \u0995\u09b0\u09c7 \u09a8\u09c7\u0993\u09af\u09bc\u09be \u2014 \u0986\u09b0 \u09b8\u09c7 \u09ad\u09be\u09ac\u09a4, \u099c\u09c0\u09ac\u09a8\u09c7 \u0986\u09b0 \u0995\u09cb\u09a8\u09cb \u099d\u09a1\u09bc \u09a4\u09be\u09a6\u09c7\u09b0 \u09ad\u09c7\u09a6 \u0995\u09b0\u09a4\u09c7 \u09aa\u09be\u09b0\u09ac\u09c7 \u09a8\u09be\u0964"},
    {scene:5, text:"\u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u099d\u09a1\u09bc \u0986\u09b8\u09c7, \u0986\u0997\u09c7 \u09a5\u09c7\u0995\u09c7 \u09a1\u09c7\u0995\u09c7 \u09a8\u09be\u0964 \u09b6\u09b0\u09a4 \u09b6\u09c7\u09b7\u09c7 \u0996\u09ac\u09b0 \u098f\u09b2: \u09a4\u09be\u09b0\u09be\u09b0 \u09ac\u09bf\u09af\u09bc\u09c7 \u09a0\u09bf\u0995 \u09b9\u09af\u09bc\u09c7\u099b\u09c7, \u09a2\u09be\u0995\u09be\u09b0 \u098f\u0995 \u09aa\u09b0\u09bf\u099a\u09bf\u09a4 \u0998\u09b0\u09c7\u0964 \u0998\u09be\u099f\u09c7\u09b0 \u09b8\u09bf\u0981\u09a1\u09bc\u09bf\u09a4\u09c7 \u09b8\u09c7 \u09b0\u09be\u09a4\u09c7 \u09a6\u09c1\u099c\u09a8 \u09ac\u09b8\u09c7 \u099b\u09bf\u09b2, \u09ae\u09be\u099d\u09c7 \u098f\u0995\u099f\u09be \u09b2\u09a3\u09cd\u09a0\u09a8, \u0986\u09b0 \u0995\u09a5\u09be\u0997\u09c1\u09b2\u09cb \u09aa\u09be\u09a5\u09b0\u09c7\u09b0 \u09ae\u09a4\u09cb \u09ad\u09be\u09b0\u09c0\u0964 \u2018\u0986\u09ae\u09bf \u099a\u09c7\u09af\u09bc\u09c7\u099b\u09bf\u09b2\u09be\u09ae,\u2019 \u09a4\u09be\u09b0\u09be \u09ab\u09bf\u09b8\u09ab\u09bf\u09b8 \u0995\u09b0\u09b2, \u2018\u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u0986\u09ae\u09be\u09b0 \u09ac\u09be\u09ac\u09be \u09a8\u09bf\u099c\u09c7\u0987 \u09a0\u09bf\u0995 \u0995\u09b0\u09c7 \u09a6\u09bf\u09df\u09c7\u099b\u09c7\u09a8\u0964\u2019"},
    {scene:6, text:"\u09af\u09be\u0993\u09af\u09bc\u09be\u09b0 \u09a6\u09bf\u09a8 \u09ad\u09cb\u09b0\u09c7 \u0998\u09be\u099f\u09c7 \u098f\u09b2 \u09a4\u09be\u09b0\u09be\u0964 \u0995\u09c1\u09af\u09bc\u09be\u09b6\u09be\u09af\u09bc \u09a6\u09c1\u099f\u09cb \u09b9\u09be\u09a4 \u098f\u0995\u09ac\u09be\u09b0 \u099b\u09c1\u0981\u09af\u09bc\u09c7 \u0997\u09c7\u09b2\u0964 \u2018\u099a\u09bf\u09a0\u09bf \u09b2\u09bf\u0996\u09ac,\u2019 \u09b8\u09c7 \u09ac\u09b2\u09b2, \u2018\u09aa\u09cd\u09b0\u09a4\u09bf \u09ae\u09be\u09b8\u09c7\u0964\u2019 \u09b2\u099e\u09cd\u099a\u099f\u09be \u0995\u09c1\u09af\u09bc\u09be\u09b6\u09be \u0997\u09bf\u09b2\u09c7 \u09a8\u09bf\u09df\u09c7 \u0997\u09c7\u09b2 \u09a6\u09c1\u099c\u09a8\u0995\u09c7 \u09a6\u09c1\u0987 \u09a6\u09bf\u0995\u09c7\u0964 \u09b0\u09be\u09ab\u09bf \u09a6\u09be\u0981\u09a1\u09bc\u09bf\u09af\u09bc\u09c7 \u09b0\u0987\u09b2 \u09b8\u09c7\u0987 \u09b0\u09cb\u09a6 \u0993\u09a0\u09be\u09b0 \u0986\u0997\u09c7 \u2014 \u09ad\u09c7\u09ac\u09c7\u099b\u09bf\u09b2, \u09a6\u09c2\u09b0\u09a4\u09cd\u09ac \u09ae\u09be\u09a8\u09c7 \u09b6\u09c1\u09a7\u09c1 \u099a\u09bf\u09a0\u09bf\u09b0 \u09a6\u09bf\u09a8 \u09ac\u09be\u09a1\u09bc\u09be\u0964"},
    {scene:7, text:"\u099a\u09bf\u09a0\u09bf \u0986\u09b8\u09a4, \u09a4\u09bf\u09a8 \u09ae\u09be\u09b8\u0964 \u09a4\u09be\u09b0\u09aa\u09b0 \u0996\u09be\u09ae\u09c7\u09b0 \u09a0\u09bf\u0995\u09be\u09a8\u09be\u09af\u09bc \u09b6\u09c1\u09a7\u09c1 \u09a8\u09a6\u09c0\u09b0 \u09ae\u09a4\u09cb \u09a8\u09c0\u09b0\u09ac\u09a4\u09be\u0964 \u099c\u09be\u09a8\u09be\u09b2\u09be\u09b0 \u09b8\u09bf\u0981\u09a1\u09bc\u09bf\u09a4\u09c7 \u099c\u09ae\u09c7 \u09a5\u09be\u0995\u09be \u099a\u09bf\u09a0\u09bf\u0997\u09c1\u09b2\u09cb \u09b0\u09be\u09ab\u09bf \u09ac\u09c7\u0981\u09a7\u09c7 \u09b0\u09be\u0996\u09b2 \u09b8\u09c1\u09a4\u09be\u09af\u09bc \u2014 \u09af\u09a4\u09a6\u09bf\u09a8\u09c7\u09b0 \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be, \u09a4\u09a4 \u0993\u099c\u09a8\u0964 \u09ae\u09be\u09a8\u09c1\u09b7 \u09ac\u09a6\u09b2\u09be\u09af\u09bc, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u099a\u09bf\u09a0\u09bf \u09ac\u09a6\u09b2\u09be\u09af\u09bc \u09a8\u09be; \u098f\u0987 \u09aa\u09cd\u09b0\u09a5\u09ae \u09b8\u09c7 \u099c\u09be\u09a8\u09b2, \u0985\u09aa\u09c7\u0995\u09cd\u09b7\u09be\u09b0 \u099a\u09c7\u09af\u09bc\u09c7 \u09a8\u09c0\u09b0\u09ac\u09a4\u09be \u09ac\u09a1\u09bc \u0995\u09b7\u09cd\u099f\u0964"},
    {scene:8, text:"\u09ac\u099b\u09b0 \u0998\u09c1\u09b0\u09a4\u09c7 \u098f\u09b2 \u0986\u09b0\u09c7\u0995 \u0996\u09ac\u09b0 \u2014 \u09a4\u09be\u09b0\u09be\u09b0 \u09ac\u09bf\u09af\u09bc\u09c7 \u09b9\u09af\u09bc\u09c7 \u0997\u09c7\u099b\u09c7\u0964 \u09b8\u09c7\u09a6\u09bf\u09a8 \u09ac\u09c3\u09b7\u09cd\u099f\u09bf\u09a4\u09c7 \u0998\u09be\u099f \u09ab\u09be\u0981\u0995\u09be; \u09b0\u09be\u09ab\u09bf \u099b\u09be\u09a4\u09be\u099f\u09be \u0996\u09c1\u09b2\u09c7\u0993 \u09a4\u09c1\u09b2\u09b2 \u09a8\u09be, \u09ad\u09c7\u099c\u09be \u09ac\u09b8\u09c7 \u09b0\u0987\u09b2 \u0998\u09a3\u09cd\u099f\u09be\u09b0 \u09aa\u09b0 \u0998\u09a3\u09cd\u099f\u09be\u0964 \u09b9\u09c3\u09a6\u09af\u09bc \u09ad\u09be\u0999\u09cd\u0997\u09be \u09ae\u09be\u09a8\u09c7 \u09b6\u09ac\u09cd\u09a6 \u09b9\u09af\u09bc \u09a8\u09be, \u099c\u09be\u09a8\u09cb? \u09b8\u09c7 \u09b6\u09ac\u09cd\u09a6\u099f\u09be \u09b8\u09c7\u09a6\u09bf\u09a8 \u09aa\u09cd\u09b0\u09a5\u09ae \u09b6\u09c1\u09a8\u09b2 \u2014 \u09ac\u09c3\u09b7\u09cd\u099f\u09bf\u09b0 \u09ad\u09c7\u09a4\u09b0\u09c7, \u09a8\u09bf\u099c\u09c7\u09b0 \u09ac\u09c1\u0995\u09c7\u09b0 \u09ad\u09c7\u09a4\u09b0\u09c7\u0964"},
    {scene:9, text:"\u09b0\u09be\u09a4\u0997\u09c1\u09b2\u09cb \u098f\u09b0\u09aa\u09b0 \u0995\u09be\u099f\u09b2 \u09b0\u09be\u0997\u09c7\u0964 \u09a8\u09a6\u09c0\u0995\u09c7 \u09a6\u09cb\u09b7 \u09a6\u09bf\u09b2, \u09ad\u09be\u0997\u09cd\u09af\u0995\u09c7 \u09a6\u09bf\u09b2, \u09a8\u09bf\u099c\u09c7\u0995\u09c7 \u09a6\u09bf\u09b2\u0964 \u09ac\u099c\u09cd\u09b0 \u099b\u099f\u09ab\u099f \u0995\u09b0\u09a4, \u0986\u09b0 \u09b8\u09c7 \u0998\u09be\u099f\u09c7\u09b0 \u09b6\u09c7\u09b7 \u09b8\u09bf\u0981\u09a1\u09bc\u09bf\u09a4\u09c7 \u09a6\u09be\u0981\u09a1\u09bc\u09bf\u09af\u09bc\u09c7 \u09a8\u09a6\u09c0\u09b0 \u0993\u09aa\u09be\u09b0\u09c7 \u0995\u09c7\u0989 \u09b6\u09c1\u09a8\u09a4 \u09a8\u09be\u0964 \u0995\u09cd\u09b7\u09cb\u09ad \u09ad\u09be\u09b2\u09cb \u099c\u09bf\u09a8\u09bf\u09b8 \u09a8\u09af\u09bc, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u09ad\u09be\u0999\u09cd\u0997\u09be \u09ae\u09be\u09a8\u09c1\u09b7\u09c7\u09b0 \u09aa\u09cd\u09b0\u09a5\u09ae \u09ad\u09be\u09b7\u09be \u2014 \u0995\u09b7\u09cd\u099f\u099f\u09be \u09ac\u099f\u09c7\u09b0 \u09a8\u09c0\u09a4\u09bf \u09a8\u09c7\u0987 \u09ac\u09be\u09a7 \u09a6\u09c7\u09af\u09bc\u0964"},
    {scene:10, text:"\u09a4\u09be\u09b0\u09aa\u09b0 \u098f\u0995 \u09b0\u09be\u09a4\u09c7 \u09aa\u09c1\u09b0\u09cb\u09a8\u09cb \u09ae\u09be\u099d\u09bf \u0995\u09b0\u09bf\u09ae \u099a\u09be\u099a\u09be\u09b0 \u09a8\u09cc\u0995\u09be\u09af\u09bc \u0989\u09a0\u09b2 \u09b8\u09c7\u0964 \u099a\u09be\u099a\u09be \u09b2\u09a3\u09cd\u09a0\u09a8 \u099c\u09cd\u09ac\u09be\u09b2\u09bf\u09af\u09bc\u09c7 \u09ac\u09b2\u09b2, \u2018\u09a8\u09a6\u09c0 \u09a5\u09c7\u09ae\u09c7 \u09a5\u09be\u0995\u09c7 \u09a8\u09be, \u09b0\u09c7\u0964 \u09a5\u09c7\u09ae\u09b2\u09c7 \u09a4\u09cb \u09ae\u09b0\u09c7\u0964 \u09a4\u09c1\u0987 \u09a5\u09c7\u09ae\u09c7 \u0997\u09c7\u099b\u09bf\u09b8 \u09ac\u09b2\u09c7\u0987 \u09ac\u09cd\u09af\u09a5\u09be \u09ac\u09be\u09a1\u09bc\u099b\u09c7\u0964 \u099a\u09b2\u09c7 \u09af\u09be, \u09a4\u09c7\u09b0\u09aa\u09b0 \u09a6\u09c7\u0996 \u2014 \u09ac\u09cd\u09af\u09a5\u09be \u09a4\u09cb \u09aa\u09c7\u099b\u09a8\u09c7 \u09a5\u09be\u0995\u09ac\u09c7, \u0995\u09bf\u09a8\u09cd\u09a4\u09c1 \u099a\u09b2\u09c7 \u09af\u09be\u0993\u09af\u09bc\u09be\u099f\u09be \u09a4\u09cb \u099c\u09c0\u09ac\u09a8\u0964\u2019 \u09b8\u09c7 \u09b0\u09be\u09a4\u09c7 \u09b0\u09be\u09ab\u09bf \u09aa\u09cd\u09b0\u09a5\u09ae \u0995\u09be\u09a8\u09cd\u09a6\u09c7 \u09ab\u09c7\u09b2\u09b2 \u09ae\u09be\u09a8\u09c1\u09b7\u09c7\u09b0 \u09b8\u09be\u09ae\u09a8\u09c7\u0964"},
    {scene:11, text:"\u098f\u09b0\u09aa\u09b0 \u09ac\u099b\u09b0 \u09aa\u09be\u0981\u099a\u09c7\u0995 \u0995\u09c7\u099f\u09c7 \u0997\u09c7\u09b2 \u09a7\u09c0\u09b0\u09c7\u0964 \u09b0\u09be\u09ab\u09bf \u0993\u09aa\u09be\u09b0\u09c7\u09b0 \u09b8\u09cd\u0995\u09c1\u09b2\u09c7 \u09b6\u09bf\u0995\u09cd\u09b7\u0995 \u09b9\u09b2\u09cb, \u09aa\u09cd\u09b0\u09a4\u09bf\u09a6\u09bf\u09a8 \u09a8\u09cc\u0995\u09be\u09af\u09bc \u0995\u09b0\u09c7 \u09ac\u09be\u099a\u09cd\u099a\u09be\u09a6\u09c7\u09b0 \u09a8\u09bf\u09af\u09bc\u09c7 \u09a8\u09a6\u09c0 \u09aa\u09be\u09b0 \u0995\u09b0\u09a4\u0964 \u0995\u09c7\u0989 \u099c\u09be\u09a8\u09a4 \u09a8\u09be \u09a4\u09be\u09b0 \u09ac\u09c1\u0995\u09c7\u09b0 \u09ad\u09c7\u09a4\u09b0 \u0995\u09c0 \u0986\u099b\u09c7; \u09ac\u09be\u099a\u09cd\u099a\u09be\u09a6\u09c7\u09b0 \u09b9\u09be\u09b8\u09bf\u09b0 \u09ad\u09be\u09b0 \u09ac\u09b9\u09a8\u09c7 \u09ae\u09be\u09a8\u09c1\u09b7 \u09a8\u09bf\u099c\u09c7\u09b0 \u09ad\u09be\u09b0 \u09ad\u09c1\u09b2\u09c7 \u09af\u09be\u09af\u09bc \u2014 \u09b8\u09c7 \u09aa\u09cd\u09b0\u09a4\u09bf\u09a6\u09bf\u09a8 \u09b8\u09c7\u0987 \u099c\u09be\u09a6\u09c1 \u09a6\u09c7\u0996\u09a4\u0964"},
    {scene:12, text:"\u0986\u099c\u0993 \u09b6\u09cd\u09b0\u09be\u09ac\u09a3\u09c7 \u09ac\u09c3\u09b7\u09cd\u099f\u09bf \u09a8\u09be\u09ae\u09b2\u09c7 \u09b0\u09be\u09ab\u09bf \u0993\u0987 \u09b0\u09be\u09b8\u09cd\u09a4\u09be\u099f\u09be \u09ae\u09a8\u09c7 \u0995\u09b0\u09c7, \u09a4\u09ac\u09c7 \u09b9\u09be\u09b8\u09bf\u09ae\u09c1\u0996\u09c7\u0964 \u098f\u0995\u09a6\u09bf\u09a8 \u09ab\u09c7\u09b0\u09bf\u09a4\u09c7 \u09ac\u09c3\u09b7\u09cd\u099f\u09bf\u09b0 \u09ae\u09be\u099d\u09c7 \u09a6\u09c2\u09b0\u09c7 \u09b0\u0993\u099a\u09cd\u099b\u09a8\u09c1 \u09a6\u09c7\u0996\u09c7 \u09ac\u09c1\u099d\u09b2: \u09ad\u09be\u09b2\u09cb\u09ac\u09be\u09b8\u09be \u09b9\u09be\u09b0\u09be\u09af\u09bc \u09a8\u09be, \u09b6\u09c7\u0996\u09be \u09b9\u09af\u09bc\u0964 \u09ad\u09be\u0999\u09cd\u0997\u09be \u09b9\u09c3\u09a6\u09af\u09bc \u09ae\u09be\u09a8\u09c7 \u09b6\u09c7\u09b7 \u09a8\u09af\u09bc \u2014 \u0993\u0996\u09be\u09a8 \u09a5\u09c7\u0995\u09c7\u0987 \u0986\u09b8\u09b2 \u0997\u09b2\u09cd\u09aa\u099f\u09be \u09b6\u09c1\u09b0\u09c1 \u09b9\u09af\u09bc\u0964 \u09a8\u09a6\u09c0 \u098f\u0996\u09a8\u09cb \u09ac\u09af\u09bc\u09c7 \u09af\u09be\u09af\u09bc; \u09b8\u09c7\u0993\u0964"}
  ]
};
/* ================================ */

document.documentElement.classList.add('js');
const bn=n=>String(n).replace(/\d/g,d=>'\u09e6\u09e7\u09e8\u09e9\u09ea\u09eb\u09ec\u09ed\u09ee\u09ef'[d]);
const bg=document.getElementById('bg');
for(let i=1;i<=SCENE_COUNT;i++){
  const el=document.createElement('div');
  el.className='layer';
  el.style.backgroundImage=`url(scene${i}.webp)`;
  bg.appendChild(el);
}
const veil=document.createElement('div');veil.className='veil';bg.appendChild(veil);
const tint=document.createElement('div');tint.className='tint';bg.appendChild(tint);

const main=document.getElementById('story');
const words=STORY.sections.map(s=>s.text).join(" ").split(/\s+/).length;
const mins=Math.max(1,Math.round(words/140));
const hero=document.createElement('section');hero.className='hero';
hero.dataset.scene=1;
hero.innerHTML=`<div class="kicker">ScrollTales</div><h1>${STORY.title}</h1><p class="sub">${STORY.subtitle} \u00b7 \u09aa\u09a1\u09bc\u09a4\u09c7 \u09aa\u09cd\u09b0\u09be\u09af\u09bc ${bn(mins)} \u09ae\u09bf\u09a8\u09bf\u099f</p>`;
main.appendChild(hero);
STORY.sections.forEach((s,i)=>{
  const sec=document.createElement('section');
  if(i%2===1)sec.className='r';
  sec.dataset.scene=s.scene;
  sec.innerHTML=`<div class="card"><div class="num">\u09a6\u09c3\u09b6\u09cd\u09af ${bn(String(s.scene).padStart(2,'0'))}</div><p>${s.text}</p></div>`;
  main.appendChild(sec);
});
const end=document.createElement('section');end.className='end';end.dataset.scene=SCENE_COUNT;
end.innerHTML=`<div class="big">${STORY.endTitle}</div><div class="small">${STORY.endNote}</div>`;
main.appendChild(end);

const dots=document.getElementById('dots');
STORY.sections.forEach((s,i)=>{
  const a=document.createElement('a');a.href='#';a.dataset.i=i;dots.appendChild(a);
});
dots.addEventListener('click',e=>{
  e.preventDefault();
  const i=+e.target.dataset.i;
  main.querySelectorAll('section')[i+1].scrollIntoView({behavior:'smooth'});
});

const secs=[...document.querySelectorAll('section')];
function reveal(){
  document.querySelectorAll('.card').forEach(c=>{
    if(c.getBoundingClientRect().top<innerHeight*.85)c.classList.add('on');
  });
}
addEventListener('scroll',reveal,{passive:true});
addEventListener('resize',reveal,{passive:true});
reveal();

const layers=[...document.querySelectorAll('.layer')];
const bar=document.getElementById('bar');
const hint=document.getElementById('hint');
const sceneOf=secs.map(s=>+s.dataset.scene);
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  const p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
  bar.style.width=(p*100)+'%';
  hint.classList.toggle('gone',scrollY>innerHeight*.25);
  const nb=secs.length;
  const f=p*(nb-1);
  const k=Math.min(nb-2,Math.floor(f));
  const frac=f-k;
  const t=sceneOf[k]-1+(sceneOf[k+1]-sceneOf[k])*frac;
  layers.forEach((ly,i)=>{
    const o=Math.max(0,Math.min(1,1-Math.abs(t-i)));
    ly.style.opacity=o;
    ly.style.transform=`scale(${1.06+Math.abs(t-i)*.05}) translateY(${(t-i)*14}px)`;
  });
  const cur=Math.round(t);
  [...dots.children].forEach((a,i)=>a.classList.toggle('act',i===cur-1));
}
addEventListener('scroll',onScroll,{passive:true});
onScroll();
</script>
</body>
</html>
