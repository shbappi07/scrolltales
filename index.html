<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrollTales — stories you scroll through</title>
<meta name="description" content="A scroll-driven reading experience: the story text moves beside you while the scene changes with every step.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Inter,"Noto Serif Bengali",sans-serif;background:#0b0e14;color:#f2ede2;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0}
#bg .layer{position:absolute;inset:-5%;background-size:cover;background-position:center;opacity:0;will-change:opacity,transform}
#bg .veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 52%,rgba(4,6,11,.62) 100%)}
#bg .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,10,18,.35),rgba(8,10,18,.15) 40%,rgba(8,10,18,.5))}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#e8a75c,#f6d08a);z-index:60;box-shadow:0 0 12px rgba(232,167,92,.7)}
#dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:column;gap:10px}
#dots a{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);display:block;transition:all .3s}
#dots a.act{background:#f6d08a;transform:scale(1.5);box-shadow:0 0 10px rgba(246,208,138,.8)}
main{position:relative;z-index:2}
section{min-height:135vh;display:flex;align-items:center;padding:10vh 7vw}
section .card{max-width:620px;background:rgba(9,12,20,.58);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:2.4rem 2.6rem;box-shadow:0 24px 60px rgba(0,0,0,.45)}
@supports not (backdrop-filter:blur(1px)){section .card{background:rgba(9,12,20,.88)}}
.js .card{opacity:0;transform:translateY(34px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.js .card.on{opacity:1;transform:none}
section.r{justify-content:flex-end}
.num{font-size:.72rem;letter-spacing:.4em;color:#e8a75c;text-transform:uppercase;margin-bottom:1.1rem;font-weight:600}
.card p{font-family:"Cormorant Garamond","Noto Serif Bengali",serif;font-size:clamp(1.15rem,2.3vw,1.5rem);line-height:1.8}
.hero{min-height:100vh;flex-direction:column;justify-content:center;text-align:center;gap:1.4rem}
.hero .kicker{font-size:.8rem;letter-spacing:.5em;text-transform:uppercase;color:#e8a75c;font-weight:600}
h1{font-family:"Cormorant Garamond","Noto Serif Bengali",serif;font-size:clamp(2.6rem,7.5vw,5rem);font-weight:600;line-height:1.08;text-shadow:0 4px 40px rgba(0,0,0,.6)}
.hero .sub{opacity:.85;font-size:clamp(.95rem,1.6vw,1.1rem);max-width:40ch;margin:0 auto}
.end{min-height:80vh;justify-content:center;text-align:center;flex-direction:column;gap:1rem}
.end .big{font-family:"Cormorant Garamond","Noto Serif Bengali",serif;font-size:clamp(1.8rem,4vw,2.6rem)}
.end .small{opacity:.7;letter-spacing:.2em;font-size:.85rem;text-transform:uppercase}
#hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:55;font-size:.72rem;letter-spacing:.35em;text-transform:uppercase;opacity:.75;animation:bob 2.2s ease-in-out infinite;transition:opacity .5s}
#hint.gone{opacity:0}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}
@media (max-width:640px){section{min-height:115vh;padding:8vh 6vw}.card{padding:1.7rem 1.5rem}#dots{right:10px}}
</style>
</head>
<body>
<div id="bg"></div>
<div id="bar"></div>
<nav id="dots"></nav>
<div id="hint">Scroll</div>
<main id="story"></main>
<script>
/* ===== EDIT YOUR STORY HERE =====
   scene = which background image (scene1.webp ... sceneN.webp)
   Bangla text works out of the box (Noto Serif Bengali is loaded).
   To make a new story: change title/subtitle/sections, swap the scene
   images, and set SCENE_COUNT to the number of images. */
const SCENE_COUNT = 12;
const STORY = {
  title: "The Lighthouse Keeper's Letter",
  subtitle: "A story in twelve scenes. Scroll slowly \u2014 the sea will follow you.",
  endTitle: "The End",
  endNote: "Scroll up to read it again",
  sections: [
    {scene:1, text:"Elias had kept the Gray Cliff light for forty years. Through the great gale of '61 and a dozen quieter storms, the lamp had never once gone dark \u2014 not even the night the oil ran low and he fed the wick with broken chair legs. Tonight, with autumn rattling the windows like a beggar at the door, it burned as steady as ever."},
    {scene:2, text:"But before the lamp, there was the letter. He unlocked the brass drawer the way a priest opens a reliquary. The paper had gone soft as cloth at its folds, the ink faded to the color of weak tea. He did not need to read it. He read it anyway."},
    {scene:3, text:"\u201cWhen the lamp fails, keep it burning anyway. Someone is always coming home.\u201d Mara had written it in the winter she got sick, her letters slanting where her hand had begun to shake. The doctor gave her until spring. She gave the letter to Elias instead."},
    {scene:4, text:"They had met on this very pier, in the summer of 1919. She stepped off the mail boat with one trunk and no hat, laughed at the gulls, and asked whether the light ever got lonely. Forty years, he told the empty room. Forty years, and it never once did while she was here."},
    {scene:5, text:"That November the sea turned vicious. Rain fell sideways for three days, lightning walked the horizon, and the rocks below the cliff vanished under walls of black water."},
    {scene:6, text:"In the village below, every window went dark \u2014 every window but one, where the harbor master's wife sat up with the wireless. At a quarter past nine it crackled: the Petrel was overdue. Six men. Out in that."},
    {scene:7, text:"Elias was already at the window. Far out through the chaos, a lantern \u2014 a tiny fishing boat, one flickering star against the storm, crawling toward the cliff with its heart in its mouth."},
    {scene:8, text:"He took the spiral stairs two at a time, the way he hadn't in twenty years, and threw himself against the crank. The gears shrieked. His shoulders burned. The machine was forty years old, and so was he \u2014 and neither of them, he decided, was finished yet."},
    {scene:9, text:"The great lens roared to life. Its beam tore a hole in the night, swept the boiling sea, and held: a road of gold light laid across the black water, steady as a promise. He kept it turning \u2014 when the wind tried to tear the roof off, he turned it; when spray froze on the glass, he turned it. Somewhere down that road of light, he knew, a man was steering by nothing else in the world."},
    {scene:10, text:"Near one in the morning the Petrel slid into the lee of the pier, more driftwood than boat. One by one the six came up the cliff path, salt-crusted and shaking and alive. The last of them was the harbor master's own son."},
    {scene:11, text:"By dawn the sea lay down like a sleeping child. Elias stood with the young man in the gold light, and neither of them said anything at all. Some letters, it turns out, are answered not in words."},
    {scene:12, text:"That morning Elias went back to the brass drawer, dipped his pen, and added one line beneath his wife's words, in a hand almost as steady as hers: \u201cKept it burning. They came home.\u201d Then he slept until noon, and the light over Gray Cliff waited for him like a good dog."}
  ]
};
/* ================================ */

document.documentElement.classList.add('js');
const bg=document.getElementById('bg');
for(let i=1;i<=SCENE_COUNT;i++){
  const el=document.createElement('div');
  el.className='layer';
  el.style.backgroundImage=`url(scene${i}.webp)`;
  bg.appendChild(el);
}
const veil=document.createElement('div');veil.className='veil';bg.appendChild(veil);
const tint=document.createElement('div');tint.className='tint';bg.appendChild(tint);

const main=document.getElementById('story');
const words=STORY.sections.map(s=>s.text).join(' ').split(/\s+/).length;
const mins=Math.max(1,Math.round(words/200));
const hero=document.createElement('section');hero.className='hero';
hero.dataset.scene=1;
hero.innerHTML=`<div class="kicker">ScrollTales</div><h1>${STORY.title}</h1><p class="sub">${STORY.subtitle} \u00b7 about ${mins} min read</p>`;
main.appendChild(hero);
STORY.sections.forEach((s,i)=>{
  const sec=document.createElement('section');
  if(i%2===1)sec.className='r';
  sec.dataset.scene=s.scene;
  const n=String(s.scene).padStart(2,'0');
  sec.innerHTML=`<div class="card"><div class="num">Scene ${n}</div><p>${s.text}</p></div>`;
  main.appendChild(sec);
});
const end=document.createElement('section');end.className='end';end.dataset.scene=SCENE_COUNT;
end.innerHTML=`<div class="big">${STORY.endTitle}</div><div class="small">${STORY.endNote}</div>`;
main.appendChild(end);

const dots=document.getElementById('dots');
STORY.sections.forEach((s,i)=>{
  const a=document.createElement('a');a.href='#';a.dataset.i=i;dots.appendChild(a);
});
dots.addEventListener('click',e=>{
  e.preventDefault();
  const i=+e.target.dataset.i;
  main.querySelectorAll('section')[i+1].scrollIntoView({behavior:'smooth'});
});

const secs=[...document.querySelectorAll('section')];
function reveal(){
  document.querySelectorAll('.card').forEach(c=>{
    if(c.getBoundingClientRect().top<innerHeight*.85)c.classList.add('on');
  });
}
addEventListener('scroll',reveal,{passive:true});
addEventListener('resize',reveal,{passive:true});
reveal();

const layers=[...document.querySelectorAll('.layer')];
const bar=document.getElementById('bar');
const hint=document.getElementById('hint');
const sceneOf=secs.map(s=>+s.dataset.scene);
function onScroll(){
  const max=document.documentElement.scrollHeight-innerHeight;
  const p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
  bar.style.width=(p*100)+'%';
  hint.classList.toggle('gone',scrollY>innerHeight*.25);
  const nb=secs.length;
  const f=p*(nb-1);
  const k=Math.min(nb-2,Math.floor(f));
  const frac=f-k;
  const t=sceneOf[k]-1+(sceneOf[k+1]-sceneOf[k])*frac;
  layers.forEach((ly,i)=>{
    const o=Math.max(0,Math.min(1,1-Math.abs(t-i)));
    ly.style.opacity=o;
    ly.style.transform=`scale(${1.06+Math.abs(t-i)*.05}) translateY(${(t-i)*14}px)`;
  });
  const cur=Math.round(t);
  [...dots.children].forEach((a,i)=>a.classList.toggle('act',i===cur-1));
}
addEventListener('scroll',onScroll,{passive:true});
onScroll();
</script>
</body>
</html>
